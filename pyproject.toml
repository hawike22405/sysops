[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysops"
version = "0.1.3"
description = "Terminal-first system information reporter (prototype)"
authors = [
  {name = "hawike22405"}
]
license = {text = "MIT"}

# Dependencies required when installing the package
dependencies = [
  "Pillow>=10.0",
]

[project.scripts]
sysops = "sysops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
