[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysops"
version = "0.1.5"
description = "Terminal-first system information reporter (prototype)"
authors = [
  {name = "hawike22405"}
]
license = {text = "MIT"}

# Dependencies required when installing the package
dependencies = [
  "rich>=13.0.0",
  "psutil>=5.0.0",
  "Pillow>=10.0",
  "windows-curses; sys_platform == 'win32'"
]

[project.scripts]
sysops = "sysops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
